        <path d="M364 767 L580 891" stroke="#7692C3" stroke-opacity="0.12"
              stroke-width="0.8" vector-effect="non-scaling-stroke"/>
      </g>

      <!-- Complete top cube; the upper white hook prism covers part of its right face. -->
      <g id="solid-top-blue-cube">
        <title>Top blue cube</title>
        <desc>Three visible faces; the right face is drawn in full and then occluded by the upper white prism.</desc>
        <path id="top-cube-right-face"
