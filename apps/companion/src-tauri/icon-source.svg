        <path d="M373 324 L536 416 L698 320"
              stroke="#E6F1FF" stroke-opacity="0.15" stroke-width="0.8"
              vector-effect="non-scaling-stroke"/>
      </g>

      <!-- Thin blue rectangular prism, painted over the lower cuboid. -->
      <g id="solid-middle-blue-slab">
        <title>Middle blue rectangular slab</title>
        <desc>Thin cuboid with top, front and right faces.</desc>
        <path id="middle-slab-right-face"
