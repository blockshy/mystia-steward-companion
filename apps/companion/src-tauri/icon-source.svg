<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" data-icon-background="#FFFFFF" data-android-background="#FFFFFF">
  <title>Flutter 探针程序图标</title>
  <desc>原样使用 migration/flutter HEAD 0f8090f774296898a508af2b38b1ceaf13994eb8 的 tests/flutter-android-probe/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png；与 Windows 探针使用同一 Flutter 标志。</desc>
  <!-- 内嵌探针原始 PNG，确保离线生成时不依赖测试目录、外部链接或重新绘制的近似图形。 -->
  <!-- 背景层保持透明；仅在 Apple 和 Android 自适应格式要求背景时由生成脚本补充白底。 -->
  <g id="icon-background"></g>
  <g id="icon-foreground">
    <image x="0" y="0" width="1024" height="1024" href="data:image/png;base64,"/>
  </g>
</svg>
