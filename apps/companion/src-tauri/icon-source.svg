      <rect x="62" y="61" width="1130" height="1133" rx="207" ry="207" fill="#0E1F3B"/>
      <rect x="62" y="61" width="1130" height="1133" rx="207" ry="207" fill="#173054" fill-opacity="0.04"/>
    </g>

    <g id="icon-foreground">
      <!-- Complete lower cuboid; the slab and lower white prism occlude it later. -->
      <g id="solid-lower-dark-cuboid">
        <title>Lower dark blue rectangular cuboid</title>
        <desc>Full top, front and right faces are present. The top is partially hidden by the middle slab.</desc>
        <path id="lower-dark-right-face"
