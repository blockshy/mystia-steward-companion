<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="0 0 1024 1024"
     preserveAspectRatio="xMidYMid meet"
     data-icon-background="#0E1F3B"
     data-android-background="#173054"
     fill="none" shape-rendering="geometricPrecision">
  <title>Isometric modular solids icon — reconstructed vector</title>
  <desc>Five editable 3D solids on a rounded navy square. Hidden portions are preserved as full faces and are naturally occluded by later layers.</desc>

  <metadata>
    <![CDATA[
    {
      "solids": [
        {"id":"solid-top-blue-cube","type":"cube / rectangular hexahedron","faces":["top","front-left","right"],"occluded":["part of right face by upper white hook prism"]},
        {"id":"solid-upper-white-hook-prism","type":"extruded concave hook-profile prism","faces":["top extrusion face","front profile face","right/end face"]},
        {"id":"solid-middle-blue-slab","type":"thin rectangular prism","faces":["top","front","right"]},
        {"id":"solid-lower-dark-cuboid","type":"rectangular cuboid","faces":["top","front","right"],"occluded":["top face by middle blue slab","right face edge by lower white D prism"]},
        {"id":"solid-lower-white-d-prism","type":"extruded D-profile prism","faces":["top extrusion face","left/end face","front D-profile face"]}
      ],
      "seams":"Adjacent faces reuse identical coordinates; pale compound underlays prevent antialiasing hairlines when rasterized.",
      "curves":"Rounded profiles use continuous cubic Bezier segments."
    }
    ]]>
  </metadata>
  <g transform="matrix(0.9037952339 0 0 0.9037952339 -54.6796116505 -55.1315092674)">
