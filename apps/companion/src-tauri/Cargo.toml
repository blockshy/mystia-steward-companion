[package]
name = "mystia-steward-companion"
version = "1.3.0"
description = "Desktop companion window for mystia-steward-companion"
authors = ["mystia-steward-companion contributors"]
edition = "2021"
rust-version = "1.97.1"

[lib]
name = "mystia_steward_companion_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mystia-steward-companion"
path = "src/main.rs"

[[bin]]
name = "mystia-steward-companion-updater"
path = "src/bin/updater.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2"

[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = false

[profile.release]
strip = "symbols"
