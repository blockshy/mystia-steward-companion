[package]
name = "mystia-steward-companion"
version = "1.3.0"
description = "Desktop companion window for mystia-steward-companion"
authors = ["mystia-steward-companion contributors"]
edition = "2021"
rust-version = "1.97.1"

[features]
updater-windows-ui-check = ["dep:windows-sys"]

[lib]
name = "mystia_steward_companion_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mystia-steward-companion"
path = "src/main.rs"

[[bin]]
name = "mystia-steward-companion-updater"
path = "src/bin/updater.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
windows-sys = { version = "0.61.2", optional = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = false

[profile.release]
strip = "symbols"
