[package]
name = "mystia-steward-companion-flutter-updater-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false

[features]
install-fixture = []
# The reused product cancellation module declares this cfg for its own checks.
updater-windows-ui-check = []

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[[bin]]
name = "mystia-steward-companion-updater"
path = "src/bin/bootstrap.rs"

[[bin]]
name = "mystia-steward-companion-updater-install-probe"
path = "src/bin/install_fixture_bootstrap.rs"
required-features = ["install-fixture"]

[[bin]]
name = "mystia-updater-install-node-driver"
path = "src/bin/install_node_driver.rs"
required-features = ["install-fixture"]

[workspace]
