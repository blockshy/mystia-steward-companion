name: Flutter old Mod node probe

on:
  workflow_dispatch:
  push:
    branches: [migration/flutter]
    paths:
      - '.github/workflows/flutter-old-mod-probe.yml'
      - 'tests/flutter-old-mod-probe/**'
      - 'scripts/build-flutter-old-mod-probe.ps1'
      - 'toolchain.lock.json'

permissions: {}

jobs:
  windows-node-driver:
    name: Build fixed Windows old Mod probe driver
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup locked Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Install locked PowerShell and GitHub CLI
        shell: pwsh
        run: |
          $expected = (Get-Content toolchain.lock.json -Raw | ConvertFrom-Json).node
          if ((node --version) -cne "v$expected" -or $LASTEXITCODE -ne 0) { throw 'Node differs from the toolchain lock.' }
          node scripts/install-locked-release-tools.mjs --install-root "$env:RUNNER_TEMP/old-mod-probe-tools"
          if ($LASTEXITCODE -ne 0) { throw 'Locked release tools installation failed.' }
      - name: Install locked Rust and formatter
        shell: pwsh
        run: |
          $version = (Get-Content toolchain.lock.json -Raw | ConvertFrom-Json).rust
          rustup toolchain install "$version-x86_64-pc-windows-msvc" --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Locked Rust installation failed.' }
      - name: Verify and build committed payload
        shell: pwsh
        env:
          MYSTIA_NODE_DRIVER_GIT_SHA: ${{ github.sha }}
        run: |
          & "$env:RUNNER_TEMP/old-mod-probe-tools/powershell/pwsh.exe" -NoLogo -NoProfile -NonInteractive -File scripts/build-flutter-old-mod-probe.ps1 -OutputDirectory "$env:RUNNER_TEMP/mystia-old-mod-node-payload" -EvidenceDirectory "$env:RUNNER_TEMP/mystia-old-mod-node-build-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Old Mod node payload verification/build failed.' }
      - name: Upload build and mock test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mystia-old-mod-node-build-evidence
          path: |
            ${{ runner.temp }}/mystia-old-mod-node-build-evidence/*.log
            ${{ runner.temp }}/mystia-old-mod-node-build-evidence/**/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload fixed node payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mystia-old-mod-node-payload
          path: ${{ runner.temp }}/mystia-old-mod-node-payload/
          if-no-files-found: error
          retention-days: 14
