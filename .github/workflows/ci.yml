name: CI

on:
  workflow_dispatch:

permissions: {}

jobs:
  companion-check:
    name: Flutter client and package checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Install isolated locked Corepack
        run: |
          node scripts/install-locked-corepack.mjs --install-root "$RUNNER_TEMP/mystia-corepack"

      - name: Verify frontend toolchain
        run: node scripts/check-build-toolchain.mjs frontend

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Audit Flutter release policy
        run: |
          corepack pnpm audit:github-actions
          corepack pnpm audit:flutter-release

      - name: Install locked Flutter
        run: |
          node scripts/install-locked-flutter.mjs --install-root "$RUNNER_TEMP/flutter"
          echo "MYSTIA_FLUTTER_SDK_ROOT=$RUNNER_TEMP/flutter" >> "$GITHUB_ENV"

      - name: Resolve locked Flutter dependencies
        run: corepack pnpm flutter:get

      - name: Analyze Flutter and run public unit tests
        run: |
          corepack pnpm flutter:format-check
          corepack pnpm flutter:generated-check
          corepack pnpm flutter:verify-unit
          corepack pnpm flutter:contracts-unit

      - name: Validate complete package policy
        run: |
          corepack pnpm audit:package-manifest
          corepack pnpm audit:windows-runtime
