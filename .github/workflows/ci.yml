name: CI

on:
  workflow_dispatch:

permissions: {}

jobs:
  companion-check:
    name: Companion frontend checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Install isolated locked Corepack
        run: |
          node scripts/install-locked-corepack.mjs --install-root "$RUNNER_TEMP/mystia-corepack"

      - name: Verify frontend toolchain
        run: node scripts/check-build-toolchain.mjs frontend

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Audit GitHub Actions policy
        run: corepack pnpm audit:github-actions

      - name: Lint
        run: corepack pnpm lint

      - name: Build frontend
        run: corepack pnpm build
