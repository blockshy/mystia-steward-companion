name: CI

on:
  workflow_dispatch:

jobs:
  companion-check:
    name: Companion frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install and enable locked Corepack
        run: |
          npm install --global corepack@0.35.0
          corepack enable

      - name: Verify frontend toolchain
        run: node scripts/check-build-toolchain.mjs frontend

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Lint
        run: corepack pnpm lint

      - name: Build frontend
        run: corepack pnpm build
